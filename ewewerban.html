<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ewewerban – Profil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d0c0b;
            --card-bg: #171513;
            --accent-amber: #d97706;
            --accent-yellow: #fbbf24;
            --accent-red: #881337;
            --text-main: #e5e5e5;
            --text-muted: #9ca3af;
            --font-pixel: 'Press Start 2P', monospace;
            --font-retro: 'VT323', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-retro);
            font-size: 1.4rem;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
        }

        header {
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            font-family: var(--font-pixel);
            font-size: 0.75rem;
            color: var(--accent-amber);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--accent-yellow);
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 3px solid var(--accent-amber);
            box-shadow: 0 0 20px rgba(217, 119, 6, 0.25);
            padding: 2.5rem;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px dashed var(--accent-amber);
            padding-bottom: 1.5rem;
        }

        .username {
            font-family: var(--font-pixel);
            font-size: 2.2rem;
            color: var(--accent-yellow);
            text-shadow: 3px 3px 0px var(--accent-red);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.5rem;
        }

        .section-title {
            font-family: var(--font-pixel);
            font-size: 1rem;
            color: var(--accent-amber);
            margin: 2rem 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            background-color: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent-amber);
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .link-button {
            display: block;
            text-align: center;
            background-color: var(--accent-amber);
            color: #000;
            font-family: var(--font-pixel);
            font-size: 0.7rem;
            padding: 0.8rem;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 3px 3px 0px var(--accent-red);
            transition: transform 0.1s;
        }

        .link-button:hover {
            transform: translate(-2px, -2px);
            background-color: var(--accent-yellow);
        }

        footer {
            text-align: center;
            padding: 2rem;
            font-family: var(--font-pixel);
            font-size: 0.6rem;
            color: var(--text-muted);
        }
    </footer>
</head>
<body>

    <header>
        <a href="/" class="back-link">&lt; BURSZTYN STUDIO</a>
        <span style="font-family: var(--font-pixel); font-size: 0.65rem; color: var(--text-muted);">USER PROFILE</span>
    </header>

    <main>
        <div class="profile-card">
            <div class="profile-header">
                <h1 class="username">EWEWERBAN</h1>
                <p class="subtitle">Indie Game Dev | Creator | Community Admin</p>
            </div>

            <div class="section-title">► O MNIE</div>
            <ul class="info-list">
                <li><strong>Gamedev:</strong> Twórca w <strong>Bursztyn Studio</strong>, pracujący nad projektem retro pixel horroru <em>Don't Turn Back</em>.</li>
                <li><strong>Administracja:</strong> Administrator serwisu <strong>harcwiki.sowa.eu.org</strong>.</li>
                <li><strong>Obecność w sieci:</strong> Aktywność na platformach gamedevowych oraz społecznościowych (itch.io, Bluesky, Cloudflare Pages).</li>
            </ul>

            <div class="section-title">► LINKI I PROFILI</div>
            <div class="links-grid">
                <a href="https://ewewerban.itch.io" target="_blank" class="link-button">ITCH.IO</a>
                <a href="https://ewewerban.bluesky.social" target="_blank" class="link-button">BLUESKY</a>
                <a href="https://harcwiki.sowa.eu.org" target="_blank" class="link-button">HARCWIKI</a>
                <a href="https://ewewerban.pages.dev" target="_blank" class="link-button">PAGES.DEV</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; EWEWERBAN / BURSZTYN STUDIO</p>
    </footer>

</body>
</html>
